<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Year 7 Music Listening Assessment</title>
<style>
body{font-family:Arial,sans-serif;background:#172b47;color:white;margin:0;padding:24px}
main{max-width:900px;margin:auto}
section{background:#263e60;border-radius:14px;padding:20px;margin:20px 0}
.video{aspect-ratio:16/9;max-width:700px;background:#091525}
.video iframe{width:100%;height:100%}
button{background:#69a1ff;color:#071c35;border:0;border-radius:8px;padding:14px 18px;font-size:17px;font-weight:bold;cursor:pointer;margin:12px 8px 0 0}
.status{color:#d2e3fa}
</style>
</head>
<body><main>
<h1>Year 7 Music – Listening Assessment</h1>
<p>Teacher controls: select an extract and press Play / Replay.</p>
<div id="clips"></div>
<p>Test all extracts before the exam. YouTube adverts and embedding restrictions may affect playback.</p>
</main>
<script>
const clips=[
{title:"Extract 1 – We Will Rock You",id:"46C5IHC_uo8",start:80,end:130},
{title:"Extract 2",id:"OqvHWUZZdP0",start:64,end:140},
{title:"Extract 3",id:"_D0ZQPqeJkk",start:0,end:87}
];
const players=[],timers=[];
let active=-1;
const root=document.getElementById("clips");
clips.forEach((c,i)=>{
const section=document.createElement("section");
section.innerHTML='<h2>'+c.title+'</h2><p>'+Math.floor(c.start/60)+':'+String(c.start%60).padStart(2,"0")+' to '+Math.floor(c.end/60)+':'+String(c.end%60).padStart(2,"0")+'</p><div class="video"><div id="video-'+i+'"></div></div><button id="play-'+i+'">▶ Play / Replay</button><button id="stop-'+i+'">■ Stop</button><p class="status" id="status-'+i+'">Loading player…</p>';
root.appendChild(section);
document.getElementById("play-"+i).onclick=()=>play(i);
document.getElementById("stop-"+i).onclick=()=>stop(i);
});
function message(i,s){document.getElementById("status-"+i).textContent=s}
function stop(i){clearInterval(timers[i]);if(players[i]&&players[i].pauseVideo)players[i].pauseVideo();if(active===i)active=-1;message(i,"Stopped / ready to replay")}
function play(i){
if(!players[i]||!players[i].seekTo){message(i,"Player not ready");return}
if(active!==-1)stop(active);
clearInterval(timers[i]);active=i;
players[i].seekTo(clips[i].start,true);
players[i].playVideo();
message(i,"Playing…");
timers[i]=setInterval(()=>{
if(active===i&&players[i].getCurrentTime()>=clips[i].end-0.15){stop(i);message(i,"Extract finished")}
},150);
}
window.onYouTubeIframeAPIReady=()=>{
clips.forEach((c,i)=>{
players[i]=new YT.Player("video-"+i,{
videoId:c.id,
playerVars:{start:c.start,end:c.end,playsinline:1},
events:{
onReady:()=>message(i,"Ready to play"),
onError:e=>message(i,"YouTube error "+e.data+" – check embedding permissions")
}
});
});
};
const script=document.createElement("script");
script.src="https://www.youtube.com/iframe_api";
document.head.appendChild(script);
</script></body></html>
